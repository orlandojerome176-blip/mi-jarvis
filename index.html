<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS de Orlando</title>
<style>
body{margin:0;background:#030914;color:#83eaff;font-family:Arial,sans-serif;text-align:center;padding:24px 15px}
h1{letter-spacing:6px}
#orb{margin:35px auto;width:130px;height:130px;border:3px solid #36dfff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 30px #078bca;animation:pulse 2s infinite}
#orb span{width:65px;height:65px;border-radius:50%;background:radial-gradient(circle,#fff,#35dfff 40%,#07518b);box-shadow:0 0 25px #38dfff}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 45px #078bca}}
#status{font-size:13px;margin:15px}
.panel{max-width:460px;margin:20px auto;padding:15px;background:#081827;border:1px solid #155276;border-radius:15px}
#chat{height:210px;overflow:auto;text-align:left}
.msg{padding:10px;margin:8px 0;background:#102c40;border-radius:9px;overflow-wrap:anywhere}
input{width:95%;box-sizing:border-box;padding:12px;background:#030914;color:white;border:1px solid #278ab3;border-radius:8px;font-size:16px}
button{padding:12px;margin:6px;background:#10405c;color:white;border:1px solid #38dfff;border-radius:9px}
</style>
</head>
<body>
<h1>J.A.R.V.I.S.</h1>
<p>ASISTENTE PERSONAL DE ORLANDO</p>
<div id="orb"><span></span></div>
<div id="status">SISTEMA EN ESPERA</div>
<div class="panel">
<div id="chat"><div class="msg"><b>JARVIS:</b> Sistema iniciado. ¿Qué necesitas?</div></div>
<input id="entrada" placeholder="Escribe una orden...">
<br><button id="enviar">Enviar</button><button id="micro">🎙 Hablar</button><button id="voz">🔊 Voz activada</button>
</div>
<script>
const $=id=>document.getElementById(id);
let voz=true,escuchando=false;
function decir(t){if(voz&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';speechSynthesis.speak(u)}}
function agregar(nombre,t){let d=document.createElement('div');d.className='msg';let b=document.createElement('b');b.textContent=nombre+': ';d.append(b,document.createTextNode(t));$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
function enviar(){let t=$('entrada').value.trim();if(!t)return;$('entrada').value='';agregar('TÚ',t);let q=t.toLowerCase(),r;
if(q.includes('hola'))r='Saludos, Orlando. Estoy a tu servicio.';
else if(q.includes('hora'))r='La hora es '+new Date().toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'});
else if(q.includes('fecha'))r='Hoy es '+new Date().toLocaleDateString('es-DO',{dateStyle:'full'});
else if(q.includes('ayuda')||q.includes('puedes hacer'))r='Puedo saludarte, decirte la hora y fecha y abrir YouTube. Mi inteligencia artificial todavía está en desarrollo.';
else if(q.includes('como te llamas')||q.includes('cómo te llamas'))r='Soy JARVIS, tu asistente personal.';
else if(q.includes('youtube')){r='Puedes abrir YouTube desde este enlace.';let a=document.createElement('a');a.href='https://m.youtube.com/';a.target='_blank';a.rel='noopener';a.textContent='Abrir YouTube';a.style.color='#83eaff';$('chat').append(a)}
else r='Todavía no conozco esa orden. Escribe ayuda para ver mis comandos.';
agregar('JARVIS',r);$('status').textContent='ORDEN PROCESADA';decir(r)}
$('enviar').onclick=enviar;
$('entrada').addEventListener('keydown',e=>{if(e.key==='Enter')enviar()});
$('voz').onclick=()=>{voz=!voz;$('voz').textContent=voz?'🔊 Voz activada':'🔇 Voz desactivada';if(!voz&&'speechSynthesis'in window)speechSynthesis.cancel()};
$('micro').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){agregar('JARVIS','El micrófono no está disponible aquí. Prueba la página publicada en HTTPS.');return}if(escuchando)return;let rec=new R();rec.lang='es-DO';rec.onstart=()=>{escuchando=true;$('status').textContent='TE ESTOY ESCUCHANDO'};rec.onresult=e=>{$('entrada').value=e.results[0][0].transcript;enviar()};rec.onerror=()=>agregar('JARVIS','No pude reconocer la voz. Revisa el permiso del micrófono.');rec.onend=()=>{escuchando=false;$('status').textContent='SISTEMA EN ESPERA'};rec.start()};
</script>
</body>
</html>
